[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-log-triage"
version = "0.1.0"
description = "Deterministic, explainable grouping of JUnit test failures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ci-log-triage = "ci_log_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
